<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b40"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Flight Track</title></head><body><header><strong>FLIGHT TRACK</strong><span id="status">Offline</span></header><main><section id="login"><h1>Sign in</h1><form id="auth"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="lock" hidden><h1>Unlock Flight Track</h1><form id="unlock"><label>Device PIN<input name="pin" type="password" inputmode="numeric" required></label><button>Unlock</button></form><button id="resetSession" type="button">Sign out instead</button></section><div id="app" hidden><nav id="nav"></nav><div id="view"></div></div><p id="message" role="status"></p></main><script src="app.js" defer></script></body></html>
